<!DOCTYPE html>
<html>

<head>
  <title>Form</title>
</head>

<body>
  <article id="Contact_Me">
    <h2>Contact Me</h2>
    <p>I'd like to here it from you!</p>

    <form action="https://httpbin.org/get" method="get">
      <fieldset>
        <legend>FILL THE FORM</legend>
        <p>
          <label for="firstName">First Name</label>
          <input type="text" name="firstName" id="firstName" placeholder="Enter Your First Name" required autofocus />
        </p>
        <p>
          <label for="lastName">Last Name</label>
          <input type="text" name="lastName" id="lastName" placeholder="Enter your Last Name" required>
        </p>
        <p>
          <label for="password">Password</label>
          <input type="password" name="password" id="password" placeholder="Enter Password" required>
        </p>
        <p>
          <label for="phone">Phone</label>
          <input type="tel" name="phone" id="phone" placeholder="0000000000" pattern="[0-9]{3}[0-9]{3}[0-9]{4}"
            required>
        </p>
        <p>
          <label for="decade">Favourite Decade</label>
          <input type="number" name="decade" id="decade" min="1950" max="2024" step="10" value="1980" required>
        </p>

                    <label for="drink">Favourite Drink</label>
                    <select name="Drink" id="drink" multiple size="2">
                        <optgroup label="Coffee">
                            <option value="rc"> Regular Coffee</option>
                            <option value="ic">Iced Coffee</option>
                        </optgroup>
                        <optgroup label="Tea">

                        </optgroup>

                    </select>
                </p> -->

        <p>
          <label for="coffee">Favourite Coffee</label>
          <input type="text" name="coffee" id="coffee" list="coffee-list">
          <datalist id="coffee-list">
            <option value="coffee"></option>
            <option value="latte"></option>
            <option value="Espresso"></option>
            <option value="Americano"></option>
            <option value="other"></option>
          </datalist>
        </p>
      </fieldset>
    </form>

    <br />

    <fieldset>
      <legend>Favourite Food</legend>
      <p>
        <input type="radio" name="food" id="panipuri" value="panipuri">
        <label for="panipuri">Panipuri</label>
      </p>
      <p>
        <input type="radio" name="food" id="pavbhaji" value="pavbhaji">
        <label for="pavbhaji">Pav-Bhaji</label>
      </p>
      <p>
        <input type="radio" name="food" id="pizza" value="pizza">
        <label for="pizza">Pizza</label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Do you have a pet?</legend>
      <p>
        <input type="checkbox" name="pets" id="dog" value="dog">
        <label for="dog">Dog</label>
      </p>
      <p>
        <input type="checkbox" name="pets" id="cat" value="cat">
        <label for="cat">Cat</label>
      </p>
      <p>
        <input type="checkbox" name="pets" id="fish" value="fish">
        <label for="fish">Fish</label>
      </p>
      <p>
        <input type="checkbox" name="pets" id="otherpet" value="otherpet">
        <label for="otherpet">Other</label>
      </p>
    </fieldset>

    <fieldset>
      <legend>MESSAGE ME</legend>
      <label for="message">Your Message</label>
      <br>
      <textarea name="message" id="message" cols="30" rows="10" placeholder="Type your message here!!"></textarea>
    </fieldset>

    <br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
    <button type="submit" formaction="https://httpbin.org/post" formmethod="post"> Post </button>
  </article>
</body>

</html>
