<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
        <link ref="icon" href="image1.png">
        <link rel="stylesheet" href="hype.css">
    </head>
    <body>
        <h1><center>TABLE</center></h1>
        <p>&nbsp;</p>

        <hr>

        <table class="center">
            <thead>
                <tr>
                    <th>&nbsp;</th>
                    <th>Time</th>
                    <th>Activity</th>
                </tr>
            </thead>
            <tr>
                <td>
                    Morning
                </td>
                <td>
                    8:00am-12:00pm
                </td>
                <td>
                    Coding
                </td>
            </tr>

            <tr>
                <td rowspan="2">Afternoon</td>
                <td>12:00pm-1:00pm</td>
                <td>Lunch</td>
            </tr>

            <tr>
                <td>1:00pm-4:00pm</td>
                <td>Other courses</td>
            </tr>

            <tr>
                <td rowspan="2">Evening</td>
                <td>4:00pm-6:00pm</td>
                <td>Gym</td>
            </tr>

            <tr>
                <td>6:00pm-7:00pm</td>
                <td>Food</td>
            </tr>

            <tr>
                <td rowspan="2">Night</td>
                <td>7:00pm-9:00pm</td>
                <td>Coding</td>
            </tr>

            <tr>
                <td>9:00pm-10:00pm</td>
                <td>Dinner</td>
            </tr>

            <tr>
                <td colspan="3"> EAT, SLEEP, CODE, REPEAT</td>
            </tr>

        </table>
    </body>
</html>
