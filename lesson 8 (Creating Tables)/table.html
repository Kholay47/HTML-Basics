<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1><strong><center>TABLE</center></strong></h1>

        <p>I'm going to create a table using html tags and basic css.</p>

        <hr>

        <table>
            <caption>My Schedule</caption>
            <thead>
                <tr>
                    <th>&nbsp;</th>
                    <th>TIME</th>
                    <th>ACTIVITY</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Morning</th>
                    <td>
                        8am-12pm
                    </td>
                    <td>Coding</td>
                </tr>
                <tr>
                    <th>Break</th>
                    <td>
                        12pm-1pm
                    </td>
                    <td>Lunch</td>
                </tr>
                <tr>
                    <th>Afternoon</th>
                    <td>
                        1pm-4pm
                    </td>
                    <td>Other courses</td>
                </tr>
                <tr>
                    <th>Evening</th>
                    <td>
                        4pm-6pm
                    </td>
                    <td>Gym</td>
                </tr>
                <tr>
                    <th rowspan="2">Night</th>
                    <td>
                        7pm-9pm
                    </td>
                    <td>Coding</td>
                </tr>
                <tr>
                    <td>
                        9pm-10pm
                    </td>
                    <td>Dinner</td>
                </tr>
                <tr>
                    <td colspan="3">Family-time
                    </td>
                </tr>
                <tr>
                    <td rowspan="3">All other time
                    </td>
                    <td colspan="2">Sleep</td>
                </tr>
                <td colspan="2">Gaming</td>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">EAT, SLEEP, CODE, REPEAT</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
